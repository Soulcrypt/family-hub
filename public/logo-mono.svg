<!--
  Hearth mark, monochrome — just the "H" glyph in `currentColor`, no plate. For any context
  that wants a single-color silhouette (e.g. a `mask-icon`/pinned-tab use) rather than the
  fixed-blue mark. Geometry matches components/brand/hearth-mark.tsx's white "H" group exactly;
  keep both in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hearth">
  <g fill="currentColor">
    <rect x="18" y="16" width="7.5" height="32" rx="3.75" />
    <rect x="38.5" y="16" width="7.5" height="32" rx="3.75" />
    <rect x="18" y="28.25" width="28" height="7.5" rx="3.75" />
  </g>
</svg>
